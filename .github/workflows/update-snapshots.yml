name: Update Linux snapshots
# Screenshot baselines are per OS, and CI compares against the linux ones,
# which can't be made on Windows without Docker. This regenerates them on the
# same runner image as CI and uploads them as an artifact to commit.
#
# Run it by adding the `update-snapshots` label to a PR (the label event uses
# the workflow from the PR branch), or from the Actions tab once on main.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-snapshots'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      # Keep in sync with playwright.yml and the projects in playwright.config.ts.
      timeout-minutes: 10
      run: npx playwright install --with-deps chromium webkit
    - name: Update snapshots
      run: npx playwright test tests/visual.spec.ts --update-snapshots=all
    - uses: actions/upload-artifact@v7
      with:
        name: linux-snapshots
        path: tests/**/*-linux.png
        retention-days: 7
